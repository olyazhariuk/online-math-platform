<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Особистий кабінет</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f8fafc;
      margin: 0;
      padding: 0;
      color: #1e293b;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
    }

    h1 {
      text-align: center;
      color: #1e40af;
    }

    .section {
      background: #ffffff;
      border-radius: 10px;
      padding: 1.5rem;
      margin-top: 2rem;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.04);
    }

    .course {
      margin-bottom: 1.5rem;
    }

    .course-title {
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .progress-bar {
      background-color: #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
      height: 20px;
    }

    .progress-fill {
      background-color: #3b82f6;
      height: 100%;
      width: 0%;
      text-align: right;
      padding-right: 0.5rem;
      color: white;
      line-height: 20px;
      font-size: 0.9rem;
      transition: width 0.5s ease;
    }

    .recommendation {
      padding: 0.5rem 0;
    }

    .recommendation-title {
      font-weight: bold;
      margin-bottom: 0.5rem;
      color: #0f172a;
    }

    .recommendation ul {
      padding-left: 1.2rem;
      list-style-type: disc;
    }

    @media (max-width: 600px) {
      .progress-fill {
        font-size: 0.75rem;
        padding-right: 0.3rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Привіт, Оля!</h1>

    <div class="section">
      <h2>Ваші курси</h2>

      <div class="course">
        <div class="course-title">Прикладна математика</div>
        <div class="progress-bar">
          <div class="progress-fill" style="width: 75%;">75%</div>
        </div>
      </div>

      <div class="course">
        <div class="course-title">Статистика</div>
        <div class="progress-bar">
          <div class="progress-fill" style="width: 50%;">50%</div>
        </div>
      </div>

      <div class="course">
        <div class="course-title">Чисельні методи</div>
        <div class="progress-bar">
          <div class="progress-fill" style="width: 90%;">90%</div>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>Рекомендовані курси</h2>
      <div class="recommendation">
        <ul>
          <li>Математичне моделювання</li>
          <li>Основи Python для математиків</li>
          <li>Фінансова математика</li>
        </ul>
      </div>
    </div>
  </div>
</body>
</html>
